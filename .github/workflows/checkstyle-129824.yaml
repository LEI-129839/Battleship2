# 129824 - Rodrigo
name: Checkstyle MemberName gate 129824
on:
  pull_request:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  checkstyle-129824:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-129824.xml
          reporter: github-pr-check
          level: error
          fail_level: error
