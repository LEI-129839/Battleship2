# 129839 - Afonso Ribeiro
name: Checkstyle ConstantName gate 129839
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  checkstyle-129839:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: Checkstyle/checkstyle-129839.xml
          reporter: github-pr-check
          filter_mode: nofilter
          level: error
          fail_level: error
