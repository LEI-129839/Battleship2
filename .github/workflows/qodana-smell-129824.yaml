# 129824 - Rodrigo
name: Qodana smell gate 129824
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-129824.yaml
          pr-mode: false
          use-annotations: true
          post-pr-comment: true
          upload-result: true
