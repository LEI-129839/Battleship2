# 129831 Tomás Frias Rei
name: Qodana smell gate 129831
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: JetBrains/qodana-action@v2024.2.5
        with:
          args: --config qodana-129831.yaml
          use-annotations: true
          post-pr-comment: true
