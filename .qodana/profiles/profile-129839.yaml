# Cheiro: Shotgun Surgery (aproximação da estratégia de deteção do livro Lanza & Marinescu)
version: "1.0"
profile:
  base:
    name: empty
  inspections:
    - inspection: ClassWithTooManyDependents   # "Class with too many dependents" ~ ChC (Changing Classes)
      enabled: true
      severity: WARNING
      options:
        limit: 7                               # SHORT_MEMORY_CAP = 7 (default do IDE: 10)
